<!doctype html><html><head><meta charset="utf-8"><title>ReconcileAI import checks</title></head><body><h1>Browser import checks</h1><div id="checks"></div><script src="/vendor/jszip.min.js"></script><script src="/model.js"></script><script src="/engine.js"></script><script src="/demo.js"></script><script src="/io.js"></script><script>
(async()=>{const out=document.getElementById('checks');let count=0;function check(ok,text){const p=document.createElement('p');p.textContent=(ok?'PASS: ':'FAIL: ')+text;out.append(p);if(!ok)throw Error(text);count++;}try{
for(const [name,side] of [['company-ledger','ledger'],['bank-statement','bank']]){const buffer=await(await fetch('/examples/'+name+'.xlsx')).arrayBuffer(),parsed=await ReconIO.readXlsx(buffer);check(parsed.sheets.length===1,name+' worksheet count');check(JSON.stringify(parsed.sheets[0].rows)===JSON.stringify([ReconDemo.headers,...ReconDemo[side]]),name+' every parsed value equals source');const normalized=ReconEngine.normalize(parsed.sheets[0].rows.slice(1),{date:0,amount:1,description:2,reference:3,currency:4},side==='ledger'?'L':'B',{date1904:parsed.date1904});check(normalized.errors.length===0,name+' dates and amounts valid');
const zip=await JSZip.loadAsync(buffer),xml=await zip.file('xl/worksheets/sheet1.xml').async('string'),doc=new DOMParser().parseFromString(xml,'application/xml');const cells=[...doc.getElementsByTagNameNS('*','c')];for(const c of cells.filter(c=>c.getAttribute('t')==='d')){const v=c.getElementsByTagNameNS('*','v')[0],date=v.textContent.slice(0,10);c.setAttribute('t','n');v.textContent=String(ReconEngine.day(date)-Date.UTC(1899,11,30)/86400000);}zip.file('xl/worksheets/sheet1.xml',new XMLSerializer().serializeToString(doc));const serial=await ReconIO.readXlsx(await zip.generateAsync({type:'arraybuffer',compression:'DEFLATE'}));const n=ReconEngine.normalize(serial.sheets[0].rows.slice(1),{date:0,amount:1,description:2,reference:3,currency:4},'X');check(n.errors.length===0&&n.valid[0].dateText==='2026-09-01',name+' numeric Excel dates supported');}
check(ReconIO.parseCSV('\uFEFF日期,金额,摘要\r\n2026-09-01,-20.00,"a,b"')[1][2]==='a,b','CSV BOM and quoting');check(ReconEngine.csvCell('-20.00')==='"-20.00"','negative export remains numeric');check(ReconEngine.csvCell('=HYPERLINK("bad")').startsWith('"\''),'export formula injection prevented');
const h=document.createElement('h2');h.textContent='ALL '+count+' CHECKS PASSED';out.append(h);
}catch(e){const h=document.createElement('h2');h.textContent='FAIL: '+e.message;out.append(h);}})();
</script></body></html>
